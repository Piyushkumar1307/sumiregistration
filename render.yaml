services:
  - type: web
    name: gift-desk-scanner
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GIFT_DEVICE_KEY
        sync: false
      - key: GIFT_REDEEM_URL
        value: https://airtelevents.in/api/v1/gift/redeem
      - key: SCANNER_ID
        value: ReceivedItem
      - key: GATE_ID
        value: ReceivedItem
